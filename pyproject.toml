[project]
name = "promptcov"
version = "0.2.0"
description = "Coverage analysis for system prompts: which rules are load-bearing, which are decorative fossils"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["llm", "prompts", "prompt-engineering", "testing", "coverage",
            "ablation", "anthropic", "claude"]
dependencies = []

[project.urls]
Homepage = "https://github.com/JStuBran/promptcov"
Repository = "https://github.com/JStuBran/promptcov"
Issues = "https://github.com/JStuBran/promptcov/issues"

[project.optional-dependencies]
anthropic = ["httpx>=0.25"]
embeddings = ["model2vec>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
promptcov = "promptcov.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promptcov*"]

[tool.setuptools.package-data]
promptcov = ["examples/*"]
